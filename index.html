<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlighter</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f7;--glass:rgba(255,255,255,.78);--card:#fff;--ink:#1c1c1e;--sub:#8e8e93;--acc:#007aff;--sel:rgba(120,120,128,.16);--stage:#e3e3e8;--sh:0 4px 22px rgba(0,0,0,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--glass:rgba(44,44,46,.78);--card:#636366;--ink:#fff;--acc:#0a84ff;--sel:rgba(235,235,245,.16);--stage:#101012;--sh:0 4px 22px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:6px 12px}header .zoom{justify-self:center}
header .r{justify-self:end;display:flex;align-items:center;gap:4px}
.txt{background:none;border:0;color:var(--acc);font:inherit;min-height:40px;padding:0 10px;cursor:pointer;border-radius:12px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.txt:disabled{color:var(--sub);opacity:.5}
.txt.go{background:var(--acc);color:#fff;min-height:34px;padding:0 16px;border-radius:99px;font-weight:600}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:var(--sh)}
.zoom{display:flex;align-items:center;border-radius:99px;padding:3px}
.zoom button{border:0;background:none;color:var(--ink);width:38px;height:38px;font-size:22px;font-weight:300;line-height:1;cursor:pointer;border-radius:99px}
.zoom button#zl{width:60px;font-weight:600;font-size:15px;font-family:inherit;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;text-align:center;padding:0;transition:color .25s,background .25s}
.zoom button#zl.on{color:var(--acc);background:var(--sel)}
.zoom button:disabled{opacity:.3;cursor:default}
.stage{position:relative;touch-action:none;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--stage) radial-gradient(var(--sel) 1px,transparent 1.2px) 0 0/18px 18px;padding:12px;overflow:hidden;border-radius:22px;margin:0 10px;box-shadow:inset 0 0 0 1px var(--sel)}
canvas{max-width:100%;max-height:100%;transform-origin:0 0;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.2);background:#fff}
.dock{padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.seg{position:relative;display:flex;width:288px;max-width:100%;background:var(--sel);border-radius:10px;padding:2px}
.seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:8px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s cubic-bezier(.34,1.4,.64,1)}
.seg button{position:relative;flex:1;border:0;background:none;color:var(--ink);font-weight:500;font-size:13px;font-family:inherit;padding:6px 0;border-radius:8px;cursor:pointer;opacity:.55;transition:opacity .25s}
.seg button[aria-pressed="true"]{opacity:1}
.sw{display:flex;gap:16px}
.sw button{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;outline:2.5px solid transparent;outline-offset:3px;transition:outline-color .15s,transform .15s}
.sw button[aria-pressed="true"]{outline-color:var(--ink);transform:scale(1.08)}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:30px;margin:0;background:none;cursor:pointer;--p:50%;--tr:linear-gradient(90deg,var(--acc) var(--p),var(--sel) var(--p));transition:width .4s cubic-bezier(.2,.8,.2,1),opacity .25s,margin .4s,visibility 0s .4s}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--tr)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--tr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.2)}
.nosize input[type=range]{width:0;opacity:0;margin-left:-14px;pointer-events:none;visibility:hidden}
input[type=range]:disabled{opacity:.3}
.panel{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 16px;border-radius:28px;max-width:100%}
.tools{display:flex;align-items:center;gap:2px}
.tools button{width:42px;height:42px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink);cursor:pointer;transition:background .15s,transform .1s}
.tools button:active{transform:scale(.9)}
.tools button[aria-pressed="true"]{background:var(--sel);color:var(--acc)}
.tools button:disabled{opacity:.3}
.tools i{width:1px;height:24px;background:var(--sel);margin:0 6px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-8px);padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:normal;width:max-content;max-width:88vw;z-index:12}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;z-index:9;-webkit-user-select:auto;user-select:auto}
#sheet.on{visibility:visible;opacity:1}
#sheet img{max-width:100%;max-height:68%;border-radius:10px;background:#fff;transform:scale(.9) translateY(16px);transition:transform .45s cubic-bezier(.34,1.3,.64,1)}
#sheet.on img{transform:none}
#sheet p{color:#fff;margin:0;font-size:13px}
:root{--hc:#ff8a70}
header>*,.dock{transition:opacity .3s}
body.busy header>:not(.zoom),body.busy .dock{opacity:.28}
.dock{animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) backwards}
header{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{transform:scale(.65) rotate(-8deg)}}
.tools button[aria-pressed="true"] svg{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.sw button:active{transform:scale(.85)}
.guide{position:absolute;pointer-events:none;border-radius:8px;background:var(--hc);opacity:0;mix-blend-mode:multiply;transition:top .25s cubic-bezier(.2,.8,.2,1),height .25s,left .25s,width .25s,opacity .2s}
.guide.on{opacity:.22;box-shadow:0 0 0 1.5px var(--hc)}
.guide.lock{animation:lock .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes lock{40%{transform:scaleY(1.22)}}
.ping{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--hc);pointer-events:none;animation:ping .55s ease-out forwards}
@keyframes ping{from{transform:scale(.2);opacity:.65}to{transform:scale(1.5);opacity:0}}
.cp{position:relative;width:30px;height:30px;border-radius:50%;background:conic-gradient(#ff5f6d,#ffc371,#ffe66d,#7be495,#64d2ff,#a29bfe,#ff7eb6,#ff5f6d);cursor:pointer;outline:2.5px solid transparent;outline-offset:3px;transition:outline-color .15s,transform .15s}
.cp:active{transform:scale(.85)}
.cp[aria-pressed="true"]{outline-color:var(--ink);transform:scale(1.08)}
.cp{border:0;padding:0}
.cp.set::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
#cmp:active{background:var(--sel)}
#scrim{position:fixed;inset:0;z-index:7;display:none}#scrim.on{display:block}
#pick,#note{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(380px,calc(100% - 24px));transform:translate(-50%,28px) scale(.95);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.34,1.3,.64,1),opacity .25s,visibility .25s;z-index:8;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
#pick,#note{background:color-mix(in srgb,var(--bg) 92%,transparent)}
#pick.on,#note.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.pv{height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;font:700 26px/1 Amiri,serif;color:#1b1b1b}
.pv span{background:var(--hc);padding:5px 18px;border-radius:5px;mix-blend-mode:multiply;transition:background .2s}
#pick label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
#pick label b{width:36px;font-weight:500}#pick label input{flex:1;width:auto}
.prow{display:flex;gap:8px}
#hx{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;background:var(--sel);color:var(--ink);font:500 16px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
#eye2{border:0;border-radius:10px;width:44px;background:var(--sel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.rec{display:flex;gap:12px;min-height:30px}
.rec button{width:30px;height:30px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}.rec button:active{transform:scale(.85)}
.mk{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50% 50% 50% 4px;border:0;background:var(--acc);color:#fff;font-size:14px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:2;animation:mkin .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes mkin{from{scale:0}}
#nt{border:0;border-radius:12px;padding:12px;background:var(--sel);color:var(--ink);font-size:16px;font-family:inherit;line-height:1.4;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.nrow{display:flex;justify-content:space-between}
#hud{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px) scale(.92);padding:5px 16px;min-width:76px;text-align:center;line-height:1.25;border-radius:99px;font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;opacity:0;pointer-events:none;z-index:3;transition:opacity .25s,transform .35s cubic-bezier(.34,1.4,.64,1)}
#hud.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){
  header{padding:4px 8px;gap:2px;grid-template-columns:auto 1fr auto}.txt{padding:0 5px;font-size:14px}.txt.go{padding:0 12px}
  .zoom button{width:32px;height:36px;font-size:20px}.zoom button#zl{width:52px;font-size:14px}
  .panel{padding:10px 8px}.tools button{width:34px;height:34px}.tools i{margin:0 3px}.sw{gap:12px}
}
@media (max-height:500px) and (orientation:landscape){          /* canvas gets the full height, controls move to the side */
  .app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/-1;padding:4px 12px}
  .stage{margin:0 0 8px 8px}
  .dock{min-height:0;overflow-y:auto;padding:0 8px 8px 0;justify-content:center;animation:none}
  .panel{width:100%}
}
canvas.in{animation:fadein .7s cubic-bezier(.2,.8,.2,1)}
@keyframes fadein{from{opacity:0;filter:blur(10px)}}
@media (hover:hover){.tools button:hover:not([aria-pressed="true"]):not(:disabled),.zoom button:hover,.txt:hover:not(.go){background:var(--sel)}.txt.go:hover{filter:brightness(1.12)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sz{display:flex;align-items:center;gap:8px}#sp{width:7px;height:10px;border-radius:2px;background:var(--hc);flex:none;transition:height .15s}
#sv{min-width:24px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.nosize .sz{display:none}
.pre{position:absolute;left:10px;top:10px;display:flex;padding:3px;border-radius:99px;z-index:3}
.pre button{border:0;background:none;color:var(--ink);font-family:inherit;font-weight:600;font-size:12.5px;min-width:44px;height:30px;padding:0 10px;border-radius:99px;cursor:pointer;font-variant-numeric:tabular-nums}
.pre button.on{background:var(--acc);color:#fff}
#mm{position:absolute;right:10px;bottom:10px;border-radius:10px;overflow:hidden;background:#fff center/100% 100% no-repeat;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:3;touch-action:none;cursor:pointer;outline:1px solid var(--sel)}
#mm.on{opacity:1;visibility:visible}#mm i{position:absolute;border:2px solid var(--acc);background:rgba(0,122,255,.16);border-radius:3px;pointer-events:none}
#sheet .seg{background:rgba(255,255,255,.18)}#sheet .seg::before{background:rgba(255,255,255,.3);box-shadow:none}#sheet .seg button{color:#fff}
#qr{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;width:min(288px,100%)}#qr.off{display:none}#qr input{flex:1;width:auto}#qr b{width:40px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.xrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}#sheet .txt{color:#fff}#sheet img{max-height:56%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="hl" viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h10"/></symbol>
<symbol id="er" viewBox="0 0 24 24"><path d="M8 19h11M5.2 14.2l8.6-8.6a2 2 0 012.8 0l1.8 1.8a2 2 0 010 2.8L11 19H8l-2.8-2.8a1.4 1.4 0 010-2z"/></symbol>
<symbol id="hand" viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 013 0V11m0-1V5a1.5 1.5 0 013 0v6m0-4.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6 7-2.6 0-4-1.2-5.5-3.500L4.5 14a1.5 1.500 0 012.3-1.800L8 13.5"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="dr" viewBox="0 0 24 24"><path d="M14 6l4 4M5 19l1-4 8.5-8.5a2 2 0 013 3L9 18z"/></symbol>
<symbol id="ul" viewBox="0 0 24 24"><path d="M7 5v6a5 5 0 0010 0V5M5 20h14"/></symbol>
<symbol id="un" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
<symbol id="re" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
</svg>
<div class="app">
  <header>
    <button class="txt" id="revert">Revert</button>
    <div class="zoom glass"><button id="zo" aria-label="Zoom out">&minus;</button><button id="zl" aria-label="Reset zoom to 100%" title="Reset zoom">100%</button><button id="zi" aria-label="Zoom in">+</button></div>
    <div class="r"><button class="txt" id="open">Open</button><button class="txt go" id="save">Save</button></div>
  </header>
  <div class="stage"><canvas id="c"></canvas><div class="guide" id="guide"></div><div id="hud" class="glass" aria-hidden="true">100%</div><div class="pre glass" id="pre" role="group" aria-label="Zoom presets"><button data-z="1">Fit</button><button data-z="2">200%</button><button data-z="4">400%</button></div><div id="mm" class="glass" aria-hidden="true"><i id="mv"></i></div></div>
  <div class="dock"><div class="panel glass">
    <div class="row">
      <div class="seg" id="seg" role="group" aria-label="Snap mode"><button data-m="smart" aria-pressed="true">Smart</button><button data-m="straight" aria-pressed="false">Straight</button><button data-m="free" aria-pressed="false">Free</button></div></div>
    <div class="row" id="r2">
      <div class="sw" id="sw"></div>
      <input type="range" id="size" min="10" max="90" value="34" aria-label="Marker size"><span class="sz"><i id="sp"></i><b id="sv"></b></span>
    </div>
    <div class="tools">
      <button id="t-hl" aria-pressed="true" aria-label="Highlighter"><svg class="ic"><use href="#hl"/></svg></button>
      <button id="t-ul" aria-pressed="false" aria-label="Underline"><svg class="ic"><use href="#ul"/></svg></button>
      <button id="t-er" aria-pressed="false" aria-label="Eraser"><svg class="ic"><use href="#er"/></svg></button>
      <button id="t-pan" aria-pressed="false" aria-label="Move"><svg class="ic"><use href="#hand"/></svg></button>
      <i></i>
      <button id="undo" aria-label="Undo"><svg class="ic"><use href="#un"/></svg></button>
      <button id="redo" aria-label="Redo"><svg class="ic"><use href="#re"/></svg></button>
      <i></i>
      <button id="cmp" aria-label="Hold to compare with original" title="Hold to compare with original"><svg class="ic"><use href="#eye"/></svg></button>
    </div>
  </div></div>
</div>
<div id="scrim"></div>
<div id="pick" class="glass" role="dialog" aria-label="Highlight colour">
  <div class="pv"><span>Aa أبجد</span></div>
  <label><b>Hue</b><input type="range" id="ph" min="0" max="360" step="1"></label>
  <label><b>Tone</b><input type="range" id="pt" min="62" max="90" step=".5"></label>
  <div class="prow"><input id="hx" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour"><button id="eye2" aria-label="Pick a colour from the screen" title="Pick from screen"><svg class="ic" style="width:20px;height:20px"><use href="#dr"/></svg></button></div>
  <div class="rec" id="rec"></div>
</div>
<div id="note" class="glass" role="dialog" aria-label="Note"><textarea id="nt" rows="3" maxlength="400" placeholder="Add a note to this highlight…"></textarea><div class="nrow"><button class="txt" id="ndel">Remove note</button><button class="txt go" id="ndone">Done</button></div></div>
<div id="toast" class="glass" role="status"></div>
<div id="sheet"><img id="shot" alt="Result"><p id="info"></p><div class="seg" id="fmt" role="group" aria-label="Export format"><button data-f="png" aria-pressed="true">PNG</button><button data-f="jpg" aria-pressed="false">JPG</button><button data-f="pdf" aria-pressed="false">PDF</button></div><label id="qr" class="off"><span>Quality</span><input type="range" id="q" min="50" max="100" value="92"><b id="qv">92%</b></label><div class="xrow"><button class="txt" id="share">Share</button><button class="txt" id="dl">Download</button><button class="txt" id="copy">Copy</button><button class="txt go" id="close">Done</button></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=document.querySelector('.stage');
const bk=document.createElement('canvas'),bkg=bk.getContext('2d'),lay=document.createElement('canvas'),lg=lay.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
/* Colour engine in OKLCH (CSS Color 4): equal lightness and chroma for every hue, so any colour reads as the same soft marker.
   Defaults come from the video's salmon (#fba28b = L .796, C .112, h 35). Gamut-mapped to sRGB by reducing chroma. */
const lin=v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4,gam=v=>v<=.0031308?12.92*v:1.055*v**(1/2.4)-.055,cl=v=>Math.min(1,Math.max(0,v));
function hueOf(hex){
  const [r,g,b]=[1,3,5].map(i=>lin(parseInt(hex.slice(i,i+2),16)/255));
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),q=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const A=1.9779984951*l-2.428592205*m+.4505937099*q,B=.0259040371*l+.7827717662*m-.808675766*q;
  return{h:(Math.atan2(B,A)*180/Math.PI+360)%360,c:Math.hypot(A,B)};
}
function okhex(L,C,h){
  const a=Math.cos(h*Math.PI/180),b=Math.sin(h*Math.PI/180);
  for(let c=C;;c-=.004){

  const p=pos(e);if(tool==='er'){cur={erasing:true};eraseAt(p);return}
  const u=tool==='ul',st={pts:[p],color:u?ulc():color,size:u?Math.max(5,scaleSize()*.16):scaleSize(),line:null,held:false,sx:p.x,u};
  if(mode==='smart'){const L=findLine(p.y);if(L){st.line=L;st.size=u?Math.max(5,L.h*.1):L.h;st.pts=[{x:p.x,y:u?L.cy+L.h/2+st.size*.6:L.cy}];buzz(8);if(!u){showGuide(L);lockPulse()}}}
  cur=st;ping(rel(e));if(mode==='free')arm();
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,rel(e));
  if(gest&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    gest.mv=Math.max(gest.mv,Math.abs(d-gest.d),Math.hypot(m.x-gest.m.x,m.y-gest.m.y));
    const o=gest.o,ns=clamp(o.s*d/gest.d,1,8),qx=(gest.m.x-cv.offsetLeft-o.tx)/o.s,qy=(gest.m.y-cv.offsetTop-o.ty)/o.s;
    S=ns;TX=m.x-cv.offsetLeft-S*qx;TY=m.y-cv.offsetTop-S*qy;applyView();return}
  if(pan){TX=pan.tx+e.clientX-pan.x;TY=pan.ty+e.clientY-pan.y;applyView();return}
  if(!cur)return;const p=pos(e);if(cur.erasing){eraseAt(p);return}
  const a=cur.pts[0],l=cur.pts[cur.pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)<1.5)return;
  if(cur.line){
    const L2=findLine(p.y);if(L2)cur.lastL=L2;
    if(!cur.block&&cur.lastL&&cur.lastL!==cur.line&&Math.abs(p.y-a.y)>cur.line.h*.7){cur.block=true;showGuide(null);buzz(10)}
    if(cur.block){cur.parts=blockParts(lines.indexOf(cur.line),cur.sx,lines.indexOf(cur.lastL||cur.line),p.x,cur.u);cur.pts=[a,{x:p.x,y:a.y}]}
    else{cur.tx=p.x;if(cur.ex===undefined)cur.ex=a.x;if(!cur.er)ease()}
  }
  else if(mode!=='free'||cur.held){const q=snapEnd(a,p),b=cur.pts[1],was=b&&Math.round(Math.atan2(b.y-a.y,b.x-a.x)*12/Math.PI);
    cur.pts=[a,q];if(was!==undefined&&was!==Math.round(Math.atan2(q.y-a.y,q.x-a.x)*12/Math.PI))buzz(6)}
  else{cur.pts.push({x:l.x+(p.x-l.x)*.55,y:l.y+(p.y-l.y)*.55});arm()}   // light smoothing
  draw();
});
function ease(){
  const c=cur;if(!c||!c.line||c.block)return;c.er=0;const a=c.pts[0],dx=c.tx-c.ex;
  c.ex=Math.abs(dx)<.4?c.tx:c.ex+dx*.34;c.pts=[a,{x:c.ex,y:a.y}];draw();
  if(c.ex!==c.tx){c.er=1;requestAnimationFrame(ease)}
}
function arm(){clearTimeout(holdT);holdT=setTimeout(()=>{if(cur&&cur.pts&&cur.pts.length>2){const a=cur.pts[0];cur.pts=[a,snapEnd(a,cur.pts[cur.pts.length-1])];cur.held=true;draw();buzz(8)}},450)}
function end(e){
  ptrs.delete(e.pointerId);if(gest&&ptrs.size===1&&gest.mv<8&&performance.now()-gest.t<300){undo();toast('Undo')}
  if(ptrs.size<2)gest=null;if(ptrs.size)return;
  const now=performance.now();
  if(!multi&&e.type==='pointerup'&&now-downT<260&&Math.hypot(e.clientX-downP.x,e.clientY-downP.y)<10){
    if(lastTap&&now-lastTap.t<340&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){clearTimeout(tapTimer);lastTap=null;dbl(e)}
    else{lastTap={t:now,x:e.clientX,y:e.clientY};clearTimeout(tapTimer);const ev={clientX:e.clientX,clientY:e.clientY};tapTimer=setTimeout(()=>noteAt(ev),340)}}
  clearTimeout(holdT);pan=null;document.body.classList.remove('busy');showGuide(null);
  if(cur&&cur.line&&cur.tx!==undefined)cur.pts=[cur.pts[0],{x:cur.tx,y:cur.pts[0].y}];
  if(cur&&cur.pts&&cur.pts.length>1){strokes.push(cur);redo=[];paint(bkg,cur);if(!noteHint&&strokes.length===1){noteHint=1;setTimeout(()=>toast('Tap a highlight to add a note'),700)}}
  cur=null;draw();sync();
}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

/* ---------- UI ---------- */
function sync(){$('undo').disabled=!strokes.length;$('redo').disabled=!redo.length;$('revert').disabled=!strokes.length;$('cmp').disabled=!strokes.length;$('size').disabled=mode==='smart';$('r2').classList.toggle('nosize',mode==='smart');placeMarks();saveSession()}
function setTool(t){tool=t;showGuide(null);['hl','ul','er','pan'].forEach(k=>$('t-'+k).setAttribute('aria-pressed',t===k));stage.style.cursor=t==='pan'?'grab':t==='er'?'cell':'crosshair'}
function setMode(m,auto){mode=m;showGuide(null);$('seg').style.setProperty('--i',['smart','straight','free'].indexOf(m));document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));setTool(tool==='ul'?'ul':'hl');sync();toast(MODES[m]);if(!auto)store()}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
['hl','ul','er','pan'].forEach(k=>$('t-'+k).onclick=()=>setTool(k));
function undo(){if(!strokes.length||fxLock)return;const st=strokes.pop();redo.push(st);rebake();fade(st,1,0);draw();sync()}
function rdo(){if(!redo.length||fxLock)return;const st=redo.pop();fxLock=1;sync();fade(st,0,1,()=>{strokes.push(st);paint(bkg,st);fxLock=0;sync()})}
$('undo').onclick=undo;$('redo').onclick=rdo;
$('revert').onclick=()=>{redo=[...strokes].reverse();strokes.forEach(st=>fade(st,1,0));strokes=[];rebake();draw();sync();toast('Reverted · Redo brings it back')};
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');
function sizeUI(){$('sv').textContent=size;$('sp').style.height=Math.max(6,Math.round(size*.3))+'px'}
$('size').oninput=e=>{size=+e.target.value;fill(e.target);sizeUI();store()};
function store(){try{localStorage.setItem('hl2',JSON.stringify({h:H,L:TONE,s:size,r:REC,m:mode}))}catch(e){}}
try{const P=JSON.parse(localStorage.getItem('hl2')||'{}');
  if(typeof P.h==='number'||P.h===null)H=P.h;if(P.L>=.6&&P.L<=.92)TONE=P.L;if(P.s>=10&&P.s<=90)size=P.s;if(MODES[P.m]){mode=P.m;$('seg').style.setProperty('--i',['smart','straight','free'].indexOf(mode));document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode))}if(Array.isArray(P.r))REC=P.r.filter(Number.isFinite).slice(0,6)}catch(e){}
PH.forEach((h,i)=>{const b=document.createElement('button');b.dataset.h=h;b.setAttribute('aria-label','Colour '+(i+1));b.onclick=()=>{setInk(h);setTool('hl')};$('sw').appendChild(b)});
const cp=document.createElement('button');cp.className='cp';cp.title='More colours';cp.setAttribute('aria-label','More colours');cp.setAttribute('aria-haspopup','dialog');
cp.onclick=()=>openPick(!$('pick').classList.contains('on'));$('sw').appendChild(cp);
function setInk(h,L){H=h;if(L!=null)TONE=L;color=hexOf(H);document.documentElement.style.setProperty('--hc',color);refresh();store()}
function refresh(){
  [...$('sw').children].forEach(b=>{if(b.dataset.h){b.style.background=hexOf(+b.dataset.h);b.setAttribute('aria-pressed',H!=null&&Math.abs(H-b.dataset.h)<.5)}});
  const pre=H!=null&&PH.some(p=>Math.abs(p-H)<.5);cp.setAttribute('aria-pressed',!pre);cp.classList.toggle('set',!pre);cp.style.setProperty('--cc',color);
  if(!$('pick').classList.contains('on'))return;
  $('ph').value=H??0;$('pt').value=TONE*100;fill($('ph'));fill($('pt'));
  $('ph').style.setProperty('--tr',`linear-gradient(90deg,${[...Array(13)].map((_,i)=>hexOf(i*30)).join()})`);
  $('pt').style.setProperty('--tr',`linear-gradient(90deg,${hexOf(H,.62)},${hexOf(H,.9)})`);
  if(document.activeElement!==$('hx'))$('hx').value=color;
}
function openPick(on){$('pick').classList.toggle('on',on);$('scrim').classList.toggle('on',on);cp.setAttribute('aria-expanded',on);if(on)refresh();else remember()}
$('scrim').onclick=()=>{openPick(false);closeNote()};
$('ndone').onclick=closeNote;$('ndel').onclick=()=>{$('nt').value='';closeNote()};
function remember(){if(H!=null&&!PH.some(p=>Math.abs(p-H)<1)){REC=[Math.round(H),...REC.filter(r=>Math.abs(r-H)>2)].slice(0,6);store()}drawRec()}
function drawRec(){$('rec').replaceChildren(...REC.map(h=>{const b=document.createElement('button');b.style.background=hexOf(h);b.setAttribute('aria-label','Recent colour');b.onclick=()=>setInk(h);return b}))}
$('ph').oninput=e=>{setInk(+e.target.value);setTool('hl')};
$('pt').oninput=e=>setInk(H,e.target.value/100);
$('hx').oninput=e=>{const v=e.target.value.trim();if(/^#?[0-9a-f]{6}$/i.test(v)){const o=hueOf(v[0]==='#'?v:'#'+v);setInk(o.c<.02?null:o.h);setTool('hl')}};
if(window.EyeDropper)$('eye2').onclick=()=>new EyeDropper().open().then(r=>{const o=hueOf(r.sRGBHex);setInk(o.c<.02?null:o.h);setTool('hl')}).catch(()=>{});else $('eye2').style.display='none';
$('size').value=size;fill($('size'));sizeUI();drawRec();color=hexOf(H);document.documentElement.style.setProperty('--hc',color);refresh();
const cmp=$('cmp');
function hold(on){if(!img||showOrig===on)return;showOrig=on;draw();clearTimeout(tt);const t=$('toast');t.textContent='Original';t.classList.toggle('on',!!on)}
cmp.onpointerdown=e=>{cmp.setPointerCapture(e.pointerId);hold(1)};
['pointerup','pointercancel'].forEach(k=>cmp.addEventListener(k,()=>hold(0)));
cmp.oncontextmenu=e=>e.preventDefault();
addEventListener('keyup',e=>{if(e.key==='c')hold(0)});
$('zi').onclick=()=>zc(1);$('zo').onclick=()=>zc(-1);$('zl').onclick=()=>{S=1;applyView(true)};
$('open').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(f)load(URL.createObjectURL(f),false,f)};
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(f)load(URL.createObjectURL(f),false,f)});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))load(URL.createObjectURL(f),false,f)});
let fmt='png',lastBlob=null,bt=0,qt;
const blobOf=(t,q)=>new Promise(r=>cv.toBlob(r,t,q));
async function pdfOf(jb,w,h){                       // minimal single-page PDF wrapping the JPEG
  const e=new TextEncoder(),parts=[],off=[];let n=0;
  const add=x=>{const u=typeof x==='string'?e.encode(x):x;parts.push(u);n+=u.length},ob=(i,body)=>{off[i]=n;add(i+' 0 obj\n'+body+'\nendobj\n')};
  add('%PDF-1.4\n');ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
  const jd=new Uint8Array(await jb.arrayBuffer());off[4]=n;
  add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jd.length}>>\nstream\n`);add(jd);add('\nendstream\nendobj\n');
  const c=`q ${w} 0 0 ${h} 0 0 cm /I Do Q`;ob(5,`<</Length ${c.length}>>\nstream\n${c}\nendstream`);
  const x=n;add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(i=>String(off[i]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
async function build(){
  const my=++bt;$('info').textContent='Preparing…';
  const im0=await blobOf(fmt==='png'?'image/png':'image/jpeg',$('q').value/100);if(!im0)return toast('Could not export the image');
  const b=fmt==='pdf'?await pdfOf(im0,cv.width,cv.height):im0;if(my!==bt)return;
  lastBlob=b;const o=$('shot').src;if(o.startsWith('blob:'))URL.revokeObjectURL(o);$('shot').src=URL.createObjectURL(im0);
  $('info').textContent=cv.width+'×'+cv.height+' px, '+(b.size>1048576?(b.size/1048576).toFixed(1)+' MB':Math.round(b.size/1024)+' KB')}
$('save').onclick=()=>{fill($('q'));$('sheet').classList.add('on');build()};
document.querySelectorAll('#fmt button').forEach(b=>b.onclick=()=>{fmt=b.dataset.f;$('fmt').style.setProperty('--i',['png','jpg','pdf'].indexOf(fmt));
  document.querySelectorAll('#fmt button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('qr').classList.toggle('off',fmt==='png');build()});
$('q').oninput=e=>{fill(e.target);$('qv').textContent=e.target.value+'%';clearTimeout(qt);qt=setTimeout(build,250)};
$('share').onclick=async()=>{if(!lastBlob)return;const f=new File([lastBlob],'highlighted.'+fmt,{type:lastBlob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('Sharing is not available here, use Download')}catch(e){}};
$('dl').onclick=()=>{if(!lastBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download='highlighted.'+fmt;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
if(!window.ClipboardItem)$('copy').style.display='none';
$('copy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':await blobOf('image/png')})]);toast('Copied as PNG')}catch(e){toast('Copy not allowed here')}};
$('close').onclick=()=>$('sheet').classList.remove('on');
addEventListener('keydown',e=>{
  if(e.key==='Escape'){openPick(false);closeNote()}if(e.target.id==='hx'||e.target.id==='nt')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?rdo():undo();return}
  const k={1:'smart',2:'straight',3:'free'}[e.key];if(k)setMode(k);
  if(e.key==='c'&&!e.metaKey&&!e.ctrlKey&&strokes.length)hold(1);if(e.key==='+'||e.key==='=')zc(1);if(e.key==='-')zc(-1);if(e.key==='0'){S=1;applyView(true)}
  if(e.key==='h')setTool('hl');if(e.key==='u')setTool('ul');if(e.key==='e')setTool('er');
});
Promise.all([(document.fonts?document.fonts.load('46px Amiri','كَ'):Promise.resolve()).catch(()=>{}),idb('get').catch(()=>null)]).then(([,r])=>{
  if(r&&(r.blob||(r.strokes&&r.strokes.length)))load(r.blob?URL.createObjectURL(r.blob):sample(),false,r.blob,r.strokes||[]);   // reopen the last session
  else load(sample(),true)});
sync();
